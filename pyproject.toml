[project]
name = "makinity-cut"
version = "0.1.0"
description = "AI-agent driven video editing skill and tool suite for automated video editing, captions, silence trimming, morphing shapes, and SFX mixing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "imageio-ffmpeg>=0.5.1",
    "moviepy>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pydub>=0.25.1",
    "ffmpeg-python>=0.2.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.11.0",
    "faster-whisper>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

